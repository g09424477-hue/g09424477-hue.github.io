<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scripts do Hzl</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e);
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px; color: #fff;
  }
  .avatar {
    width: 100px; height: 100px; border-radius: 50%;
    background: linear-gradient(135deg, #00f2ea, #ff0050);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; margin-bottom: 15px; border: 3px solid #fff;
    box-shadow: 0 0 20px rgba(0, 242, 234, 0.4);
  }
  h1 { font-size: 24px; margin-bottom: 5px; }
  .bio { color: #aaa; font-size: 14px; margin-bottom: 30px; text-align: center; }
  .links { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
  .link-btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 16px 20px; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
    color: #fff; text-decoration: none; font-size: 16px; font-weight: bold;
    transition: all 0.25s ease;
  }
  .link-btn:hover {
    background: rgba(255,255,255,0.18); transform: translateY(-2px);
    border-color: #00f2ea; box-shadow: 0 5px 15px rgba(0, 242, 234, 0.2);
  }
  .link-btn .icon { font-size: 20px; }
  footer { margin-top: 40px; color: #555; font-size: 12px; }
</style>
</head>
<body>

  <div class="avatar">😎</div>
  
  <h1>Hzl</h1>
  <p class="bio">Meus scripts e projetos ✨</p>

  <div class="links">
    
    <!-- SCRIPT BROOKHAVEN -->
    <a class="link-btn" href="LINK_DO_BROOKHAVEN_AQUI" target="_blank">
      <span class="icon">🍬</span> Brookhaven Candy Helper
    </a>
    
    <!-- SCRIPT LETHAL APE -->
    <a class="link-btn" href="LINK_DO_LETHAL_APE_AQUI" target="_blank">
      <span class="icon">💎</span> Lethal Ape (Auto Collect)
    </a>

  </div>

  <footer>© 2025 - Hzl</footer>

</body>
</html>
